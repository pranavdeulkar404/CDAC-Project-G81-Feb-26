spring.application.name=sprintflow-api
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/sprintflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${SPRINTFLOW_DB_USERNAME:root}
spring.datasource.password=${SPRINTFLOW_DB_PASSWORD:Hello@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

sprintflow.jwt.secret=${SPRINTFLOW_JWT_SECRET:VGhpc0lzQVN0cm9uZ0xvY2FsRGV2ZWxvcG1lbnRTZWNyZXRLZXlGb3JTcHJpbnRGbG93MjAyNg==}
sprintflow.jwt.expiration-seconds=28800
sprintflow.notification-service.url=http://localhost:8081
sprintflow.audit.enabled=${SPRINTFLOW_AUDIT_ENABLED:true}
sprintflow.audit.url=${SPRINTFLOW_AUDIT_URL:http://localhost:8082}
sprintflow.audit.connect-timeout=1s
sprintflow.audit.read-timeout=2s

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.hibernate.SQL=INFO

# Optional Groq-powered drafting. OpenAI auto-configuration stays disabled because
# SprintFlow creates the client only when the feature is enabled and a key exists.
sprintflow.ai.enabled=${SPRINTFLOW_AI_ENABLED:true}
sprintflow.ai.provider=GROQ
sprintflow.ai.api-key=${GROQ_API_KEY:}
sprintflow.ai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
sprintflow.ai.model=${GROQ_MODEL:openai/gpt-oss-20b}
sprintflow.ai.timeout-seconds=${SPRINTFLOW_AI_TIMEOUT_SECONDS:25}
sprintflow.ai.max-input-characters=600
sprintflow.ai.max-output-characters=5000
sprintflow.ai.max-concurrent-requests=2
sprintflow.ai.max-completion-tokens=1200
sprintflow.ai.temperature=0.2

spring.ai.model.chat=none
spring.ai.model.image=none
spring.ai.model.embedding=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none
spring.ai.openai.api-key=${sprintflow.ai.api-key}
spring.ai.openai.base-url=${sprintflow.ai.base-url}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=${sprintflow.ai.model}
spring.ai.openai.chat.options.temperature=${sprintflow.ai.temperature}
spring.ai.openai.chat.options.maxCompletionTokens=${sprintflow.ai.max-completion-tokens}
spring.ai.retry.max-attempts=1
spring.ai.retry.on-client-errors=false

resilience4j.circuitbreaker.instances.sprintflowAi.sliding-window-size=6
resilience4j.circuitbreaker.instances.sprintflowAi.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.sprintflowAi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sprintflowAi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.sprintflowAi.permitted-number-of-calls-in-half-open-state=1
resilience4j.bulkhead.instances.sprintflowAi.max-concurrent-calls=${sprintflow.ai.max-concurrent-requests}
resilience4j.bulkhead.instances.sprintflowAi.max-wait-duration=0
